name: Anton Keyboard Android Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug

      - name: Prepare Android signing tools
        run: |
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          echo "BUILD_TOOLS=$BUILD_TOOLS" >> "$GITHUB_ENV"
          "$BUILD_TOOLS/zipalign" -v -p 4 app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/app-aligned.apk

      - name: Decode permanent release keystore
        env:
          ANTON_KEYSTORE_BASE64: ${{ secrets.ANTON_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANTON_KEYSTORE_BASE64" || (echo "Missing ANTON_KEYSTORE_BASE64 secret" && exit 1)
          echo "$ANTON_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/anton-keyboard-release.jks"

      - name: Sign APK with permanent key
        env:
          ANTON_KEYSTORE_PASSWORD: ${{ secrets.ANTON_KEYSTORE_PASSWORD }}
          ANTON_KEY_ALIAS: ${{ secrets.ANTON_KEY_ALIAS }}
          ANTON_KEY_PASSWORD: ${{ secrets.ANTON_KEY_PASSWORD }}
        run: |
          test -n "$ANTON_KEYSTORE_PASSWORD" || (echo "Missing ANTON_KEYSTORE_PASSWORD secret" && exit 1)
          test -n "$ANTON_KEY_ALIAS" || (echo "Missing ANTON_KEY_ALIAS secret" && exit 1)
          test -n "$ANTON_KEY_PASSWORD" || (echo "Missing ANTON_KEY_PASSWORD secret" && exit 1)
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/anton-keyboard-release.jks" \
            --ks-key-alias "$ANTON_KEY_ALIAS" \
            --ks-pass env:ANTON_KEYSTORE_PASSWORD \
            --key-pass env:ANTON_KEY_PASSWORD \
            --out app/build/outputs/apk/debug/AntonKeyboard.apk \
            app/build/outputs/apk/debug/app-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose app/build/outputs/apk/debug/AntonKeyboard.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: AntonKeyboard-Signed-APK
          path: app/build/outputs/apk/debug/AntonKeyboard.apk
          if-no-files-found: error

      - name: Publish signed APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: signed-build-${{ github.run_number }}
          name: Anton Keyboard signed build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: app/build/outputs/apk/debug/AntonKeyboard.apk
          fail_on_unmatched_files: true
